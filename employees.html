<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صفحة موظفي قسم المونتاج</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1120;color:#e5e7eb;font-family:Cairo,Arial,sans-serif}header{background:#111c31;padding:20px 4%;border-bottom:1px solid #334155}.wrap{max-width:1200px;margin:auto;padding:22px 4%}.card{background:#172338;border:1px solid #334155;border-radius:16px;padding:18px;margin-bottom:16px}.muted{color:#9ca3af;font-size:13px}h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.emp{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:13px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:680px}th,td{padding:9px;border-bottom:1px solid #334155;text-align:center;font-size:13px}th{background:#0f172a}.name{text-align:right;white-space:nowrap}.pill{display:inline-block;padding:3px 9px;border-radius:8px;background:#334155;font-size:12px}.notice{border-color:#d97706;background:#302313}.field{display:grid;gap:5px;margin:10px 0}input,select,button{font:inherit;border-radius:9px;padding:10px 12px;border:1px solid #475569;background:#0f172a;color:#f8fafc;width:100%}button{cursor:pointer;background:#059669;border:0;font-weight:700}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{font-size:12px;color:#a7f3d0}.shift-m{background:#075985}.shift-s{background:#9a3412}.shift-off{background:#475569}.day{min-width:34px}@media(max-width:600px){.wrap{padding:14px}.card{padding:13px}}
</style></head>
<body><header><h1>قسم المونتاج — عدن ولحج</h1><div class="row"><span class="muted">جدول الدوام والمهام والتوجيهات</span><span id="live" class="status">جارٍ الاتصال...</span></div></header>
<main class="wrap">
<section class="card notice"><h2>📌 توجيهات مدير القسم</h2><p id="notice">جارٍ تحميل التوجيهات...</p></section>
<section class="card"><div class="row" style="justify-content:space-between"><h2>🗓️ جدول دوام المونتاج</h2><label class="row" style="font-size:13px">الشهر <select id="month" style="width:auto"></select></label></div><div class="tablewrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div><p class="muted">ص = صباحي · م = مسائي · off = إجازة</p></section>
<section class="card"><h2>📋 المهام الروتينية والبرامج</h2><div id="employees" class="grid"></div></section>
<section class="card"><h2>🎬 تسجيل فيديو منجز</h2><p class="muted">عند إرسال النموذج يصل إشعار الإنجاز إلى لوحة المدير.</p><form id="taskForm"><div class="field"><label>اسم الموظف</label><select id="employee" required></select></div><div class="field"><label>اسم الفيديو المنجز</label><input id="video" required maxlength="180" placeholder="مثال: حلقة 12 - النسخة النهائية"></div><div class="field"><label>اسم البرنامج</label><input id="program" required maxlength="180" placeholder="اسم البرنامج"></div><button type="submit">إرسال إنجاز الفيديو</button><p id="formMsg" class="muted"></p></form></section>
</main><script src="./app.js"></script></body></html>
